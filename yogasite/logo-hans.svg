<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Halo Aura Gradient -->
    <radialGradient id="haloGradFile" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="45%" stop-color="#FFE7D6"/>
      <stop offset="100%" stop-color="#E5F3EB"/>
    </radialGradient>
    
    <!-- Halo Ring Border Gradient -->
    <linearGradient id="ringGradFile" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="45%" stop-color="#E15B32"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Sun / Bindu Radial Glow Gradient -->
    <radialGradient id="sunGradFile" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>

    <!-- Swan Body Saffron-to-Terracotta Flame Gradient -->
    <linearGradient id="swanBodyGradFile" x1="10" y1="10" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="40%" stop-color="#E14D2A"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Swan Lotus Wing Golden Light Gradient -->
    <linearGradient id="wingGradFile" x1="15" y1="16" x2="34" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Sacred Tulsi Emerald Ripple Wave Gradient -->
    <linearGradient id="rippleGradFile" x1="9" y1="39" x2="39" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Luminous Halo Aura Disc -->
  <circle cx="24" cy="24" r="22" fill="url(#haloGradFile)" stroke="url(#ringGradFile)" stroke-width="1.6"/>
  
  <!-- Sacred Golden Prana Sun / Bindu with Inner Glow -->
  <circle cx="33" cy="11" r="3.8" fill="url(#sunGradFile)"/>
  <circle cx="33" cy="11" r="1.4" fill="#FFFFFF" opacity="0.85"/>
  
  <!-- Graceful Swan (Hans) Silhouette in Saffron/Terracotta Flame -->
  <path d="M13.5 33.5C15.8 35.2 19.5 35.8 24.5 35C30.8 34 35.5 29.5 37.5 23.5C38.2 21.5 36.8 20.5 35.2 21.2C31.8 22.8 27.8 23.5 24 22.2C19.8 20.8 17.5 16.5 19.2 11.5C19.8 9.5 18.2 8.2 16.2 8.6C13.5 9.2 11.8 12.2 12.2 16C12.8 21.8 17.2 27.5 24.5 28.5C19 29.5 14.2 27.2 11.2 23.8C10.2 27.5 11.2 31.5 13.5 33.5Z" fill="url(#swanBodyGradFile)"/>
  
  <!-- Swan Inner Lotus Wing Petal in Radiant Gold -->
  <path d="M22.5 25.2C26.5 24 30.5 21 33.5 16.2C30.5 18.5 26.5 20 22.5 19.8C19 19.8 16.5 18.2 15.2 16.8C15.5 20.8 18.5 24.2 22.5 25.2Z" fill="url(#wingGradFile)"/>
  
  <!-- Serene Sacred Tulsi Emerald Ripple Wave -->
  <path d="M9 39C13 40.2 21 40.2 27 39.2C32 38.2 36 38.6 39 39.5" stroke="url(#rippleGradFile)" stroke-width="2.2" stroke-linecap="round"/>
</svg>