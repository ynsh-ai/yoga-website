<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="54" height="54" fill="none">
  <defs>
    <!-- Background Halo Aura Gradient -->
    <radialGradient id="haloGradFile" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#FEF3C7"/>
      <stop offset="85%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </radialGradient>
    
    <!-- Outer Sacred Geometry Ring -->
    <linearGradient id="ringGradFile" x1="0" y1="0" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="35%" stop-color="#E11D48"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Radiant Prana Sun / Bindu -->
    <radialGradient id="sunGradFile" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="75%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </radialGradient>

    <!-- Swan Primary Body Flame Gradient -->
    <linearGradient id="swanBodyGradFile" x1="12" y1="12" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="35%" stop-color="#E11D48"/>
      <stop offset="80%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Swan Wing Layer 1 (Outer Gold) -->
    <linearGradient id="wingGrad1File" x1="16" y1="18" x2="38" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Swan Wing Layer 2 (Inner Saffron Glow) -->
    <linearGradient id="wingGrad2File" x1="20" y1="22" x2="34" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="50%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Blooming Lotus Base Petals Gradient (Emerald & Turquoise) -->
    <linearGradient id="lotusLeafGradFile" x1="10" y1="36" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Blooming Lotus Center Core (Rose Coral) -->
    <linearGradient id="lotusCoreGradFile" x1="24" y1="30" x2="30" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Tranquil Ripple Wave -->
    <linearGradient id="rippleGradFile" x1="8" y1="45" x2="46" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>

  <!-- Luminous Halo Disc with Multi-Hue Radiance -->
  <circle cx="27" cy="27" r="24.5" fill="url(#haloGradFile)" stroke="url(#ringGradFile)" stroke-width="1.6"/>
  
  <!-- 8 Sacred Ashtanga Dots along Ring -->
  <circle cx="27" cy="4.5" r="1.1" fill="#F59E0B"/>
  <circle cx="43" cy="11" r="1.1" fill="#E11D48"/>
  <circle cx="49.5" cy="27" r="1.1" fill="#9333EA"/>
  <circle cx="43" cy="43" r="1.1" fill="#10B981"/>
  <circle cx="27" cy="49.5" r="1.1" fill="#059669"/>
  <circle cx="11" cy="43" r="1.1" fill="#10B981"/>
  <circle cx="4.5" cy="27" r="1.1" fill="#F59E0B"/>
  <circle cx="11" cy="11" r="1.1" fill="#F97316"/>

  <!-- Celestial Prana Rays around Sun Bindu -->
  <path d="M37 13.5L40 13.5M37 13.5L37 10.5M37 13.5L39.2 11.3M37 13.5L34.8 11.3" stroke="#F59E0B" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/>

  <!-- Sacred Golden Prana Sun / Bindu -->
  <circle cx="37" cy="13.5" r="4.2" fill="url(#sunGradFile)"/>
  <circle cx="37" cy="13.5" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Layered Blooming Lotus Flower Base (Left & Right Petals) -->
  <path d="M14 38.5C18 36 23 37 25.5 40C21.5 41.5 16.5 40.5 14 38.5Z" fill="url(#lotusLeafGradFile)"/>
  <path d="M40 38.5C36 36 31 37 28.5 40C32.5 41.5 37.5 40.5 40 38.5Z" fill="url(#lotusLeafGradFile)"/>
  
  <!-- Lotus Center Rose Petal -->
  <path d="M23 41.5C25 37 29 37 31 41.5C28.5 43.5 25.5 43.5 23 41.5Z" fill="url(#lotusCoreGradFile)"/>

  <!-- Graceful Swan (Hans) - Head, Neck, Body & Plumage -->
  <path d="M15 37.5C17.5 39.5 21.5 40.2 27 39.2C34 38 39.5 33 41.8 26.5C42.5 24.2 41 23 39.2 23.8C35.5 25.5 31 26.2 27 24.8C22.2 23.2 19.5 18.5 21.5 12.8C22.2 10.5 20.5 9 18.2 9.5C15.2 10.2 13.2 13.5 13.8 17.8C14.5 24.2 19.5 30.5 27.5 31.8C21.2 33 16 30.5 12.5 26.8C11.5 31 12.5 35.5 15 37.5Z" fill="url(#swanBodyGradFile)"/>
  
  <!-- Swan Wing Layer 1 (Outer Radiant Golden Feather) -->
  <path d="M25.5 28C30 26.8 34.5 23.5 38 18C34.5 20.8 30 22.5 25.5 22.2C21.5 22.2 18.8 20.5 17.2 19C17.5 23.5 21 27.2 25.5 28Z" fill="url(#wingGrad1File)"/>
  
  <!-- Swan Wing Layer 2 (Inner Saffron Crescent Feather) -->
  <path d="M24 25C27 24.2 30 22 32.5 18.5C30 20.2 27 21.2 24 21C21.2 21 19.5 19.8 18.5 18.8C18.8 21.8 21 24.2 24 25Z" fill="url(#wingGrad2File)"/>

  <!-- Serene Ripple Water Line at Base -->
  <path d="M11 44C16 45.5 24 45.5 31 44.5C36.5 43.5 41 44 44.5 45" stroke="url(#rippleGradFile)" stroke-width="2.2" stroke-linecap="round"/>
</svg>